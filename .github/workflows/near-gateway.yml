name: Near PWA and Gateway

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'services/gateway/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/near-gateway.yml'
  workflow_dispatch: {}

concurrency:
  group: near-gateway-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
  GCP_SERVICE: ${{ vars.GCP_SERVICE }}
  GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
  GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}

jobs:
  deploy:
    if: ${{ vars.NEAR_DEPLOY_ENABLED == 'true' }}
    name: Validate and deploy the family boundary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out bounded product source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            apps/web
            services/gateway
            Dockerfile
            .dockerignore
          sparse-checkout-cone-mode: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate web and gateway
        run: |
          npm ci --prefix apps/web
          npm run build --prefix apps/web
          npm ci --prefix services/gateway
          npm run typecheck --prefix services/gateway
          npm test --prefix services/gateway

      - name: Authenticate without a service-account key
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Build and push immutable image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPOSITORY }}/${{ env.GCP_SERVICE }}:${{ github.sha }}
        run: |
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build --tag "$IMAGE_URI" .
          docker push "$IMAGE_URI"

      - name: Deploy without changing identity, access, or secrets
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPOSITORY }}/${{ env.GCP_SERVICE }}:${{ github.sha }}
        run: >-
          gcloud run deploy "$GCP_SERVICE"
          --project="$GCP_PROJECT_ID"
          --region="$GCP_REGION"
          --image="$IMAGE_URI"
          --service-account="$GCP_RUNTIME_SERVICE_ACCOUNT"
          --update-env-vars="NEAR_RELEASE=near@${GITHUB_SHA}"
          --quiet

      - name: Verify the exact production release
        run: |
          service_url="$(gcloud run services describe "$GCP_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          test -n "$service_url"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$service_url/health" | grep "near@${GITHUB_SHA}"
