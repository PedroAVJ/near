name: Near TestFlight

on:
  workflow_dispatch: {}

jobs:
  build_ios:
    name: Build native Near for iOS
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Upload to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
